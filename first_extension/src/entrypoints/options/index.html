<h3>Keyboard Shortcut</h3>
<p>
  You can start area translation using a keyboard shortcut.
</p>

<p>
  Default shortcut:
  <strong>Ctrl + Z</strong>
  (or <strong>Cmd + Z</strong> on macOS)
</p>

<p>
  To change the shortcut:
  <ol>
    <li>Open <code>chrome://extensions/shortcuts</code></li>
    <li>Find <strong>On-Page Image Translator</strong></li>
    <li>Set your preferred keys</li>
  </ol>
</p>
